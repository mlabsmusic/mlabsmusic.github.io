<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">FolderToTunes current product visual</title>
  <desc id="desc">MLABS FolderToTunes interface concept showing local folder review, playlist creation and import progress.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eefbfc"/>
      <stop offset=".44" stop-color="#d8f5f7"/>
      <stop offset="1" stop-color="#f8ffff"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061114"/>
      <stop offset="1" stop-color="#0a3a42"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".86"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ccf5f7" stop-opacity=".34"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="34" stdDeviation="32" flood-color="#061114" flood-opacity=".18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1440" height="920" fill="url(#bg)"/>
  <g opacity=".65" filter="url(#soft)">
    <circle cx="1130" cy="690" r="180" fill="#00a9b7" opacity=".35"/>
    <circle cx="260" cy="230" r="150" fill="#ffffff" opacity=".65"/>
  </g>
  <path d="M0 575 C260 470 330 420 555 430 C790 440 918 506 1440 348" fill="none" stroke="#00a9b7" stroke-opacity=".24" stroke-width="18"/>
  <path d="M0 610 C320 480 456 460 644 492 C836 524 980 574 1440 470" fill="none" stroke="#061114" stroke-opacity=".1" stroke-width="5"/>

  <g transform="translate(110 74)" filter="url(#shadow)">
    <rect width="1220" height="92" rx="10" fill="url(#glass)" stroke="#fff" stroke-opacity=".82"/>
    <text x="34" y="58" fill="#061114" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="24" font-weight="800">MLABS MUSIC</text>
    <text x="966" y="58" fill="#33555b" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="21" font-weight="800">FolderToTunes</text>
  </g>

  <g transform="translate(110 218)" filter="url(#shadow)">
    <rect width="1220" height="586" rx="18" fill="#f8ffff" fill-opacity=".74" stroke="#fff" stroke-opacity=".86"/>
    <g transform="translate(34 34)">
      <rect width="284" height="518" rx="16" fill="url(#dark)" opacity=".94"/>
      <text x="28" y="44" fill="#8ee8ee" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="18" font-weight="900">FOLDERTOTUNES</text>
      <text x="28" y="88" fill="#fff" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="32" font-weight="900">De carpeta local</text>
      <text x="28" y="126" fill="#fff" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="32" font-weight="900">a playlists claras.</text>
      <text x="28" y="170" fill="#cde7ea" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="17" font-weight="700">Selecciona, revisa, importa</text>
      <text x="28" y="196" fill="#cde7ea" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="17" font-weight="700">y controla el progreso.</text>

      <g transform="translate(28 254)">
        <rect width="228" height="54" rx="12" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".2"/>
        <circle cx="28" cy="27" r="14" fill="#8ee8ee"/>
        <text x="58" y="34" fill="#fff" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="17" font-weight="800">Seleccionar carpeta</text>
      </g>
      <g transform="translate(28 324)">
        <rect width="228" height="54" rx="12" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".16"/>
        <circle cx="28" cy="27" r="14" fill="#fff" fill-opacity=".38"/>
        <text x="58" y="34" fill="#d9f1f2" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="17" font-weight="800">Vista previa</text>
      </g>
      <g transform="translate(28 394)">
        <rect width="228" height="54" rx="12" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".16"/>
        <circle cx="28" cy="27" r="14" fill="#fff" fill-opacity=".26"/>
        <text x="58" y="34" fill="#d9f1f2" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="17" font-weight="800">Importar</text>
      </g>
    </g>

    <g transform="translate(360 34)">
      <text x="0" y="36" fill="#061114" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="28" font-weight="900">Flujo actual de importacion</text>
      <text x="0" y="70" fill="#3b575d" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="18" font-weight="700">Trabaja con carpetas reales y mantiene el control antes de escribir en Music.</text>

      <g transform="translate(0 116)">
        <rect width="782" height="108" rx="16" fill="url(#glass)" stroke="#fff"/>
        <text x="26" y="38" fill="#00a9b7" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="16" font-weight="900">CARPETA FUENTE</text>
        <text x="26" y="76" fill="#061114" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="26" font-weight="900">/Music/Marques/Session Packs</text>
        <rect x="568" y="32" width="176" height="44" rx="22" fill="#061114"/>
        <text x="608" y="60" fill="#fff" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="16" font-weight="900">Conectar</text>
      </g>

      <g transform="translate(0 252)">
        <rect width="242" height="206" rx="16" fill="url(#glass)" stroke="#fff"/>
        <text x="22" y="38" fill="#00a9b7" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="15" font-weight="900">REVISION</text>
        <text x="22" y="82" fill="#061114" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="44" font-weight="900">128</text>
        <text x="102" y="80" fill="#3b575d" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="17" font-weight="800">archivos</text>
        <rect x="22" y="124" width="198" height="18" rx="9" fill="#d9eef1"/>
        <rect x="22" y="124" width="154" height="18" rx="9" fill="#00a9b7"/>
        <text x="22" y="174" fill="#3b575d" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="16" font-weight="800">Listo para importar</text>
      </g>

      <g transform="translate(270 252)">
        <rect width="242" height="206" rx="16" fill="url(#glass)" stroke="#fff"/>
        <text x="22" y="38" fill="#00a9b7" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="15" font-weight="900">PLAYLISTS</text>
        <text x="22" y="82" fill="#061114" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="44" font-weight="900">24</text>
        <text x="86" y="80" fill="#3b575d" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="17" font-weight="800">listas</text>
        <g fill="#061114" fill-opacity=".08">
          <rect x="22" y="116" width="178" height="22" rx="11"/>
          <rect x="22" y="150" width="142" height="22" rx="11"/>
        </g>
      </g>

      <g transform="translate(540 252)">
        <rect width="242" height="206" rx="16" fill="url(#glass)" stroke="#fff"/>
        <text x="22" y="38" fill="#00a9b7" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="15" font-weight="900">PROGRESO</text>
        <text x="22" y="82" fill="#061114" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="44" font-weight="900">76%</text>
        <rect x="22" y="124" width="198" height="18" rx="9" fill="#d9eef1"/>
        <rect x="22" y="124" width="150" height="18" rx="9" fill="#00a9b7"/>
        <text x="22" y="174" fill="#3b575d" font-family="Inter, Instrument Sans, Arial, sans-serif" font-size="16" font-weight="800">Importando en Music</text>
      </g>
    </g>
  </g>
</svg>
